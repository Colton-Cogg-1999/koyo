name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup update stable && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg libespeak-ng1
      - run: npm ci
        working-directory: web
      - run: npx playwright-core install --with-deps chromium
        working-directory: web
      - run: echo "CHROMIUM=$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
        working-directory: web
      - run: ./scripts/test
